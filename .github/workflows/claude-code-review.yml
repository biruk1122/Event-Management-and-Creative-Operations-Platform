name: Claude Code Review

# Posts an automated review on every pull request as the "Claude" GitHub App,
# so it appears in the Reviewers panel alongside CodeRabbit. Independent of the
# blocking Foundation CI checks. The Claude review step runs only when an
# ANTHROPIC_API_KEY secret (or CLAUDE_CODE_OAUTH_TOKEN) is configured.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Detect Claude credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" || -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        if: ${{ steps.credential.outputs.available == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request as an independent reviewer. This repo is a
            pnpm + Turborepo monorepo (apps/web Next.js, apps/api NestJS + Prisma,
            packages/api-client generated from OpenAPI). Follow AGENTS.md and the
            nested AGENTS.md files.

            Focus on: correctness and edge cases, security and authorization,
            architecture-boundary violations, database/migration/transaction
            issues, public API-contract or Prisma-type leaks, and test coverage
            of the changed behaviour. Confirm the change stays within its stated
            scope.

            Leave inline comments on specific lines and one short top-level
            summary. Be concise and specific; skip praise and nitpicks. If
            nothing blocks merging, say so.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
