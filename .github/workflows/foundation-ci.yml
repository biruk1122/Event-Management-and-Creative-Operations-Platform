name: Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_HOST: 0.0.0.0
  API_INTERNAL_URL: http://127.0.0.1:4000/api/v1
  API_PORT: 4000
  API_RATE_LIMIT_MAX: 100
  API_RATE_LIMIT_TTL_MS: 60000
  AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
  AUTH_ACCESS_TOKEN_TTL: 15m
  AUTH_COOKIE_SAME_SITE: lax
  AUTH_COOKIE_SECURE: "false"
  AUTH_REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
  AUTH_REFRESH_TOKEN_TTL: 30d
  CORS_ORIGINS: http://127.0.0.1:3000
  DATABASE_URL: postgresql://event_platform:event_platform_ci@127.0.0.1:5432/event_platform?schema=public
  FILE_STORAGE_ACCESS_KEY: minioadmin
  FILE_STORAGE_BUCKET: event-platform-files
  FILE_STORAGE_ENDPOINT: http://127.0.0.1:9000
  FILE_STORAGE_FORCE_PATH_STYLE: "true"
  FILE_STORAGE_REGION: us-east-1
  FILE_STORAGE_SECRET_KEY: minioadmin
  LOG_LEVEL: silent
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
  NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
  POSTGRES_DB: event_platform
  POSTGRES_PASSWORD: event_platform_ci
  POSTGRES_PORT: 5432
  POSTGRES_USER: event_platform
  WEB_PORT: 3000

jobs:
  quality:
    name: Quality
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API contracts
        run: pnpm openapi:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and application tests
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

      - name: Enforce web performance budgets
        run: pnpm quality:budgets

  postgres:
    name: PostgreSQL
    runs-on: self-hosted
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: event_platform
          POSTGRES_PASSWORD: event_platform_ci
          POSTGRES_USER: event_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_platform -d event_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply and inspect committed migrations
        run: |
          pnpm db:migrate:deploy
          pnpm db:migrate:status

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Build API
        run: pnpm --filter @event-platform/api build

      - name: Verify database-backed API readiness and OpenAPI
        run: |
          pnpm --filter @event-platform/api start > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health/ready > readiness.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat api.log
              exit 1
            fi
            sleep 2
          done

          grep '"status":"ready"' readiness.json
          curl --fail --silent --show-error http://127.0.0.1:4000/api/docs-json > openapi.json
          grep '"/health/ready"' openapi.json

      - name: Print API log on failure
        if: failure()
        run: cat api.log 2>/dev/null || true

  docker-compose:
    name: Docker Compose
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build development services
        run: docker compose build

      - name: Build production images
        run: |
          docker build --file docker/api.Dockerfile --target production --tag event-platform-api:ci .
          docker build --file docker/web.Dockerfile --target production --tag event-platform-web:ci .

      - name: Start the development environment
        run: docker compose up --detach db api web

      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Verify the complete environment
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/backend > web-health.json; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done

          grep '"api":"up"' web-health.json
          curl --fail --silent --show-error http://127.0.0.1:4000/health/ready > api-health.json
          grep '"status":"ready"' api-health.json
          curl --fail --silent --show-error http://127.0.0.1:3000/ > web.html
          grep "A dependable surface" web.html
          docker compose ps

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the CI environment
        if: always()
        run: docker compose down --volumes --remove-orphans

      # Dev services bind-mount the checkout and run as root, so build
      # output they touch (e.g. apps/api/dist) ends up root-owned on the
      # self-hosted runner's host filesystem. Reset it with a throwaway
      # container so the next job's actions/checkout can clean the
      # workspace as the runner's unprivileged user.
      - name: Reset workspace ownership
        if: always()
        run: docker run --rm -v "$PWD":/workspace alpine chown -R "$(id -u)":"$(id -g)" /workspace

  end-to-end:
    name: End-to-end
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      # Full browser journeys make many more requests than the unit/integration
      # rate-limit checks the workflow-wide value is tuned for. 1000 was
      # enough when this job was introduced, but the suite has since grown
      # across many merged epics and now trips it mid-run with unrelated
      # 429s in specs that never touch the feature actually under test.
      # Confirmed sufficient (with headroom to spare) against the full suite
      # as of RTC-06; not tuned to the exact current count, so it has room
      # for the epics still to come.
      API_RATE_LIMIT_MAX: 10000
    services:
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_API_CORS_ALLOW_ORIGIN: "*"
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_ROOT_USER: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        command: server /data
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: event_platform
          POSTGRES_PASSWORD: event_platform_ci
          POSTGRES_USER: event_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_platform -d event_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@10.18.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @event-platform/e2e exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Initialize private file bucket
        run: |
          docker run --rm --network host \
            -e "MC_HOST_local=http://$FILE_STORAGE_ACCESS_KEY:$FILE_STORAGE_SECRET_KEY@127.0.0.1:9000" \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            mb --ignore-existing "local/$FILE_STORAGE_BUCKET"

      - name: Run end-to-end smoke journey
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.runs/*/playwright-report
          include-hidden-files: true
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/.runs/*/test-results
          include-hidden-files: true
          retention-days: 7
